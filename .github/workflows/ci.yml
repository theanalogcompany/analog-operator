name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # A hung suite fails here in minutes instead of running until GitHub
      # cancels the job at six hours, which is what TAC-427's hang did on every
      # run for three days. A clean suite finishes in well under a minute.
      - name: Test
        timeout-minutes: 10
        run: npm test -- --ci --passWithNoTests
